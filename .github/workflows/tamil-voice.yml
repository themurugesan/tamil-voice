name: Tamil voice (Microsoft edge-tts)

on:
  push:
    paths:
      - "voice/script.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tamil-voice
  cancel-in-progress: true

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Tamil voice clips (Microsoft, free)
        run: |
          pip install edge-tts
          python voice/generate.py

      - name: Save clips to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice/out
          git commit -m "Tamil voice clips (Microsoft edge-tts) [skip ci]" || echo "nothing to commit"
          git push
